name: ci

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.12' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 chardet pytest flake8

      - name: install the qt platform libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: flake8
        run: python -m flake8 poptrayminus/poptrayminus tests

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
